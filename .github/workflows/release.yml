name: Release

on:
  push:
    tags: ["v*"]

# El GITHUB_TOKEN necesita permiso de escritura para crear el release
# y subir los binarios (por defecto es solo-lectura).
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            binary: git-desktop-jorgenio
            artifact: git-desktop-jorgenio-linux-x86_64
          - os: windows-latest
            binary: git-desktop-jorgenio.exe
            artifact: git-desktop-jorgenio-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release -p gitdesktop-app

      - name: Preparar binario con nombre de plataforma
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"

      - name: Subir artefacto del workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

      - name: Publicar en el GitHub Release del tag
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

# Nota (M5): instaladores — .deb/AppImage en Linux y MSI en Windows.
