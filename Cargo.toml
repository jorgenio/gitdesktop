[workspace]
resolver = "2"
members = ["crates/gitdesktop-core", "crates/gitdesktop-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
gitdesktop-core = { path = "crates/gitdesktop-core" }
iced = { version = "0.14", features = ["tokio"] }
git2 = { version = "0.21", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
dirs = "6"
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing", "macros"] }
rfd = "0.15"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
notify = "8"
open = "5"

[profile.release]
lto = "thin"
strip = true
