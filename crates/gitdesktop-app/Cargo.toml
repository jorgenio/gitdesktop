[package]
name = "gitdesktop-app"
description = "Cliente Git de escritorio Git-Desktop Jorgenio (interfaz iced)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "git-desktop-jorgenio"
path = "src/main.rs"

[dependencies]
gitdesktop-core = { workspace = true }
iced = { workspace = true }
rfd = { workspace = true }
time = { workspace = true }
tokio = { version = "1", features = ["process", "io-util"] }
