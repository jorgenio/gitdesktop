name: Release

on:
  push:
    tags: ["v*"]

# El GITHUB_TOKEN necesita permiso de escritura para crear el release
# y subir los binarios (por defecto es solo-lectura).
permissions:
  contents: write

jobs:
  linux:
    name: Linux (binario + .deb + AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release -p gitdesktop-app

      - name: Binario con nombre de plataforma
        run: |
          mkdir -p dist
          cp target/release/git-desktop-jorgenio dist/git-desktop-jorgenio-linux-x86_64

      - name: Empaquetar .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb -p gitdesktop-app --no-build \
            --output dist/git-desktop-jorgenio-linux-x86_64.deb

      - name: Empaquetar AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p AppDir/usr/bin \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/128x128/apps
          cp target/release/git-desktop-jorgenio AppDir/usr/bin/
          cp packaging/linux/git-desktop-jorgenio.desktop \
             AppDir/usr/share/applications/
          cp assets/icon-128.png \
             AppDir/usr/share/icons/hicolor/128x128/apps/git-desktop-jorgenio.png
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          mv Git-Desktop*.AppImage dist/git-desktop-jorgenio-linux-x86_64.AppImage

      - name: Subir artefactos del workflow
        uses: actions/upload-artifact@v4
        with:
          name: git-desktop-jorgenio-linux
          path: dist/*

      - name: Publicar en el GitHub Release del tag
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

  windows:
    name: Windows (binario + MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Asegurar WiX Toolset
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
            "C:\Program Files (x86)\WiX Toolset v3.14\bin" |
              Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build release
        run: cargo build --release -p gitdesktop-app

      - name: Empaquetar MSI (candle + light)
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          New-Item -ItemType Directory -Force -Path build, dist | Out-Null
          candle.exe crates\gitdesktop-app\wix\main.wxs `
            -arch x64 `
            "-dExePath=target\release\git-desktop-jorgenio.exe" `
            "-dIconPath=assets\icon.ico" `
            "-dProductVersion=$version" `
            -out build\main.wixobj
          light.exe build\main.wixobj `
            -ext WixUIExtension `
            -o dist\git-desktop-jorgenio-windows-x86_64.msi
          Remove-Item dist\*.wixpdb -ErrorAction SilentlyContinue

      - name: Subir artefactos del workflow
        uses: actions/upload-artifact@v4
        with:
          name: git-desktop-jorgenio-windows
          path: dist/*

      - name: Publicar en el GitHub Release del tag
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
