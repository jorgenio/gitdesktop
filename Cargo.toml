[workspace]
resolver = "2"
members = ["crates/gito-core", "crates/gito-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
gito-core = { path = "crates/gito-core" }
iced = "0.14"
git2 = { version = "0.21", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
dirs = "6"
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing"] }
rfd = "0.15"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
